<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sipariş Takibi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width: 620px">
    <h1 class="mb-2">Sipariş Takibi</h1>
    <p class="text-secondary">Sipariş numaranı ve sipariş oluşturulurken verilen takip kodunu gir.</p>
    <form id="takipForm" class="card card-body shadow-sm mb-3">
      <label for="orderId" class="form-label">Sipariş numarası</label>
      <input id="orderId" class="form-control mb-3" inputmode="numeric" autocomplete="off" required>
      <label for="trackingCode" class="form-label">Sipariş takip kodu</label>
      <input id="trackingCode" class="form-control mb-3" autocomplete="off" required>
      <button id="sorgulaBtn" class="btn btn-primary" type="submit">Siparişi sorgula</button>
    </form>
    <p id="mesaj" role="status" aria-live="polite"></p>
    <section id="sonuc" class="card card-body d-none" aria-live="polite"></section>
  </main>
  <script src="siparis-takip.js"></script>
</body>
</html>
