<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hesabım - Bilgisayar Bilgileri</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="bilgilerim.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="anasayfa.html">
                Bilgisayar Bilgileri
            </a>

            <div class="d-flex gap-3 align-items-center">
                <a href="anasayfa.html" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-house"></i> Ana Sayfa
                </a>

                <button type="button" id="cikisBtn" class="btn btn-danger btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Çıkış Yap
                </button>
            </div>

        </div>
    </nav>

    <!-- ANA İÇERİK -->
    <main class="container my-5">

        <div class="account-header mb-4">
            <h1>Hesabım</h1>
            <p>Hesap bilgilerini, teslimat adresini ve siparişlerini buradan yönetebilirsin.</p>
        </div>

        <div id="genelMesaj" class="alert" role="status" hidden></div>

        <div id="yukleniyor" class="text-center py-5">
            <div class="spinner-border text-dark" role="status"></div>
            <p class="mt-3">Hesap bilgilerin yükleniyor...</p>
        </div>

        <div id="bilgiAlani" hidden>

            <div class="row g-4">

                <!-- HESAP BİLGİLERİ -->
                <div class="col-lg-5">
                    <section class="account-card h-100">

                        <div class="card-title-row">
                            <i class="bi bi-person-circle"></i>
                            <h2>Hesap Bilgilerim</h2>
                        </div>

                        <div class="account-info">
                            <label>Ad Soyad</label>
                            <p id="adSoyad">-</p>
                        </div>

                        <div class="account-info">
                            <label>E-posta</label>
                            <p id="email">-</p>
                        </div>

                    </section>
                </div>

                <!-- ADRES BİLGİLERİ -->
                <div class="col-lg-7">
                    <section class="account-card">

                        <div class="card-title-row">
                            <i class="bi bi-geo-alt"></i>
                            <h2>Teslimat Adresim</h2>
                        </div>

                        <form id="adresForm">

                            <div class="mb-3">
                                <label for="adresAd" class="form-label">Ad Soyad</label>
                                <input
                                    type="text"
                                    id="adresAd"
                                    name="fullName"
                                    class="form-control"
                                    maxlength="150"
                                    autocomplete="name"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="adresTelefon" class="form-label">Telefon</label>
                                <input
                                    type="tel"
                                    id="adresTelefon"
                                    name="phone"
                                    class="form-control"
                                    maxlength="30"
                                    autocomplete="tel"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="adresMetni" class="form-label">Açık Adres</label>
                                <textarea
                                    id="adresMetni"
                                    name="address"
                                    class="form-control"
                                    rows="4"
                                    maxlength="1000"
                                    autocomplete="street-address"
                                    required></textarea>
                            </div>

                            <button type="submit" id="adresKaydetBtn" class="btn btn-dark">
                                <i class="bi bi-save"></i> Adresi Kaydet
                            </button>

                            <p id="adresMesaj" class="mt-3 mb-0" role="status"></p>

                        </form>

                    </section>
                </div>

                <!-- SİPARİŞ GEÇMİŞİ -->
                <div class="col-12">
                    <section class="account-card">

                        <div class="card-title-row">
                            <i class="bi bi-box-seam"></i>
                            <h2>Sipariş Geçmişim</h2>
                        </div>

                        <div id="siparisler">
                            <p class="text-muted">Siparişlerin yükleniyor...</p>
                        </div>

                    </section>
                </div>

            </div>

        </div>

        <div id="hataAlani" class="alert alert-danger" hidden></div>

    </main>

    <footer class="text-center py-4 bg-dark text-white">
        <p class="mb-0">© 2026 Bilgisayar Bilgileri</p>
    </footer>

    <script src="bilgilerim.js"></script>

</body>
</html>
